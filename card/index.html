<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f2ed">
  <meta name="description" content="Ninad Watve — Curious • Building • Living. Digital visiting card.">
  <meta property="og:title" content="Ninad Watve">
  <meta property="og:description" content="Curious • Building • Living">
  <meta property="og:type" content="website">
  <title>Ninad Watve — Digital Visiting Card</title>
  <link rel="icon" href="assets/nw-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script src="config.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>
  <main class="card" aria-labelledby="person-name">
    <header class="brand">
      <img class="brand-mark" src="assets/nw-monogram.svg" alt="NW monogram with pencil" width="112" height="112">
      <span class="brand-rule" aria-hidden="true"></span>
      <p class="eyebrow">PERSONAL CONTACT</p>
    </header>

    <section class="identity">
      <h1 id="person-name">Ninad Watve</h1>
      <p class="motto">Curious <span>•</span> Building <span>•</span> Living</p>
      <p id="tagline" class="tagline" hidden></p>
    </section>

    <nav id="contact-links" class="contact-links" aria-label="Contact links"></nav>

    <section class="save-contact">
      <button id="save-contact" class="save-button" type="button">
        <span class="save-icon" aria-hidden="true">＋</span>
        <span>Save contact</span>
      </button>
      <p class="save-note">Add my details to your address book</p>
    </section>

    <footer class="footer">
      <p id="location" class="location"></p>
      <p class="site-credit">NINAD WATVE <span>—</span> DIGITAL CARD</p>
    </footer>
  </main>
  <noscript><p class="noscript">Please enable JavaScript to view contact links and save the contact.</p></noscript>
</body>
</html>
